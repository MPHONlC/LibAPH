name: Notify Dependents

on:
  workflow_run:
    workflows: ["API Version Refresh", "ESOUI Auto Release", "GitHub Auto Release", "Bethesda Auto Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/eso-notify-dependents
        with:
          token: ${{ secrets.DEPENDENTS_DISPATCH_TOKEN }}
          source_workflow: ${{ github.event.workflow_run.path }}
