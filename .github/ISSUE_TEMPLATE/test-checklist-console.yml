name: "\u2705 LibAPH Test Checklist (Console)"
description: Run through LibAPH's Console test checklist and report results
title: '[TEST][Console] '
labels:
- testing
assignees:
- MPHONlC
body:
- type: markdown
  attributes:
    value: Thanks for testing **LibAPH** on Console! Check off everything you actually tested and confirmed working. Anything broken or partly working, describe it in the notes field at the end instead of checking it off.
- type: input
  id: version
  attributes:
    label: Add-on version
    placeholder: e.g. 2026.09.29.21.48
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    options:
    - Console (Xbox)
    - Console (PlayStation)
  validations:
    required: true
- type: checkboxes
  id: console_tests
  attributes:
    label: Console tests confirmed working
    options:
    - label: 'Load: Log in with LibAPH and all your add-ons enabled.'
    - label: 'Dialogs: Open any add-on status window (ALC or PermMemento), then run that add-on''s setup wizard (/alcwizard or /pmemwizard).'
    - label: 'Theme: Open the APH-Profiler results window and the AoM category manager (/libcategories on PC).'
    - label: 'Key hints: Open APH-Search from the main menu and look at the button hints.'
    - label: 'Right-stick mover: In ALC or PermMemento settings pick Move UI (Right Stick) and move the right stick.'
    - label: 'Left-stick resize: Open the APH-Profiler results HUD, press L3 and move the left stick.'
    - label: 'Text entry: Open APH-Search on console and select its text box.'
    - label: 'Chat output: Run /alcclean (Chat Logs on) or /pmemcur on console.'
    - label: 'Library warning: Disable LibAddonMenu-2.0 (PC) or LibHarvensAddonSettings (console), keep ALC on, reload.'
- type: textarea
  id: notes
  attributes:
    label: Anything broken, partly working, or not tested
    description: 'One line per issue: which test, what happened instead of Expected.'
    placeholder: 'e.g. PC-L-04 Bug report: popup opened but API version line was blank'
